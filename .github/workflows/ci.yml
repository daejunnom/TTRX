name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Rust quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo +stable fmt --all -- --check
      - name: Run Clippy
        run: cargo +stable clippy --workspace --all-targets --locked -- -D warnings
      - name: Test documentation
        run: cargo +stable test --workspace --doc --locked

  native:
    name: Native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            executable_suffix: ""
          - os: windows-latest
            executable_suffix: .exe
          - os: macos-latest
            executable_suffix: ""
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal
      - name: Run native tests
        run: cargo +stable test --workspace --all-targets --locked
      - name: Build release CLI
        run: cargo +stable build --release --locked -p ttrx-cli
      - name: Check release CLI
        shell: bash
        run: ./target/release/ttrx${{ matrix.executable_suffix }} --version

  msrv:
    name: Rust 1.85 minimum
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Rust 1.85
        run: rustup toolchain install 1.85.0 --profile minimal
      - name: Check workspace with minimum Rust
        run: cargo +1.85.0 check --workspace --all-targets --locked

  npm-package:
    name: npm package
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Rust and WebAssembly target
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain stable
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install matching wasm-bindgen CLI
        shell: bash
        run: |
          cargo +stable install --locked --root "$RUNNER_TEMP/wasm-bindgen" wasm-bindgen-cli --version 0.2.126
          echo "$RUNNER_TEMP/wasm-bindgen/bin" >> "$GITHUB_PATH"
      - name: Install npm package metadata
        run: npm ci
      - name: Run Rust tests
        run: npm test
      - name: Build, test, and inspect npm tarball
        shell: bash
        run: node scripts/pack-npm.mjs "$RUNNER_TEMP/npm-pack"
